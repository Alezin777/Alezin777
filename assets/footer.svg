<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
<style>
text{fill:#0d1117} .m{fill:#57606a} .a{fill:#0d1117} .b{font-weight:700}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}} .blink{animation:blink 1.1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}} .pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fade{opacity:1;animation:none}.blink,.pulse{animation:none}}

</style>
<line x1="40" y1="20" x2="860" y2="20" stroke="#d0d7de"/>
<circle class="pulse" cx="48" cy="57" r="6" fill="#0d1117"/>
<text x="66" y="62" font-size="14" class="b" text-anchor="start" >status: aberto a oportunidades de estágio</text>
<text x="66" y="86" font-size="12.5" class="m" text-anchor="start" >Engenharia de Software · Inteligência Artificial · Dados</text>
<text x="860" y="62" font-size="12.5" class="m" text-anchor="end" >~/alezin777 $ exit</text>
<text x="860" y="86" font-size="12.5" class="a" text-anchor="end" >obrigado pela visita</text>
</svg>