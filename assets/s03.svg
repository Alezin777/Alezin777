<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
<style>
text{fill:#0d1117} .m{fill:#57606a} .a{fill:#0d1117} .b{font-weight:700}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}} .blink{animation:blink 1.1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}} .pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fade{opacity:1;animation:none}.blink,.pulse{animation:none}}

</style>
<text x="40" y="40" font-size="22" class="a b" text-anchor="start" >03</text>
<text x="82" y="40" font-size="18" class="b" text-anchor="start" >— projetos</text>
<line x1="206" y1="34" x2="860" y2="34" stroke="#d0d7de"/>
</svg>